name: Bug
description: Something doesn't behave as it should
labels: ["type:bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What's broken, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Checklist. Each item should be independently verifiable.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
      description: What this ticket explicitly does not cover.
    validations:
      required: false
  - type: textarea
    id: technical-notes
    attributes:
      label: Technical Notes
      description: Repro steps, affected adapter/capability, relevant logs.
    validations:
      required: false
