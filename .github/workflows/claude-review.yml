name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          max_turns: "30"
          allowed_tools: "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*)"
          prompt: |
            Act as the read-only reviewer subagent described in
            .claude/agents/reviewer.md. Review this PR's diff against the
            hard rules and conventions in AGENTS.md. Post findings as a PR
            comment. Do not push commits, do not merge, do not edit files.
