- name: "agent:ready"
  color: "0E8A16"
  description: "Ready for the agent workflow to pick up"
- name: "agent:working"
  color: "FBCA04"
  description: "An agent is actively working this ticket"
- name: "agent:blocked"
  color: "D93F0B"
  description: "Agent run failed or got stuck; needs attention"
- name: "needs-human"
  color: "B60205"
  description: "Requires human review/approval before proceeding (e.g. CI/secrets/workflow edits)"
- name: "type:feature"
  color: "1D76DB"
  description: "New feature or capability"
- name: "type:bug"
  color: "D73A4A"
  description: "Something doesn't work as expected"
- name: "type:chore"
  color: "C5DEF5"
  description: "Maintenance, tooling, or non-feature work"
- name: "priority:p0"
  color: "B60205"
  description: "Urgent"
- name: "priority:p1"
  color: "D93F0B"
  description: "High priority"
- name: "priority:p2"
  color: "FBCA04"
  description: "Normal priority"
