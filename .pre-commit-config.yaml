repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        files: \.(cpp|hpp|h|cc)$
      - id: conventional-commit
        name: Conventional Commit message
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
